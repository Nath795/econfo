name: Update news

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

# One run at a time, so two runs can't overwrite each other's news.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore saved news
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git worktree add site FETCH_HEAD --detach
          else
            mkdir site
          fi

      - name: Build pages
        run: npm run build

      - name: Collect news
        run: npm run collect

      # Only the newest version is kept, so the repository doesn't grow with every update.
      - name: Publish
        working-directory: site
        run: |
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update news"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub pauses schedules after 60 quiet days; this keeps the schedule switched on.
      - name: Keep schedule active
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
